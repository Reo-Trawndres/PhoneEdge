<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="t">
  <title id="t">PhoneEdge: your PC mouse and keyboard on your Android phone</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="feed" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#f472b6"/>
      <stop offset="0.5" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="glow" x="-600%" y="-60%" width="1300%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="screen"><rect x="86" y="66" width="688" height="376" rx="8"/></clipPath>
    <clipPath id="phoneScreen"><rect x="910" y="50" width="210" height="450" rx="26"/></clipPath>
    <marker id="head" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#22c55e"/>
    </marker>
    <path id="arrow" d="M0,0 V24 L6,18.5 L10.5,28 L14.5,26.2 L10,17 H18 Z"/>
  </defs>

  <!-- full-bleed background -->
  <rect width="1280" height="640" fill="url(#bg)"/>
  <ellipse cx="910" cy="320" rx="380" ry="300" fill="url(#halo)"/>

  <!-- ===== left: text ===== -->
  <g font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">
    <rect x="66" y="137" width="64" height="6" rx="3" fill="#22c55e" filter="url(#glow)"/>
    <text x="62" y="235" font-size="94" font-weight="700" letter-spacing="-1.5"><tspan fill="#e2e8f0">Phone</tspan><tspan fill="#22c55e">Edge</tspan></text>
    <text x="64" y="297" font-size="34" fill="#e2e8f0">Your PC mouse &amp; keyboard</text>
    <text x="64" y="341" font-size="34" fill="#e2e8f0">on your Android phone</text>
    <text x="64" y="393" font-size="24" fill="#94a3b8">Push the mouse past the screen edge.</text>
    <text x="64" y="425" font-size="24" fill="#94a3b8">No app on the phone.</text>

    <!-- chips -->
    <g font-size="18" font-weight="600" fill="#e2e8f0">
      <rect x="64" y="463" width="125" height="40" rx="20" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <circle cx="84" cy="483" r="4" fill="#22c55e"/>
      <text x="96" y="489.5">Windows</text>

      <rect x="201" y="463" width="115" height="40" rx="20" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <circle cx="221" cy="483" r="4" fill="#22c55e"/>
      <text x="233" y="489.5">Android</text>

      <rect x="328" y="463" width="206" height="40" rx="20" fill="#14532d" fill-opacity="0.35" stroke="#22c55e" stroke-opacity="0.55" stroke-width="1.5"/>
      <circle cx="348" cy="483" r="4" fill="#22c55e"/>
      <text x="360" y="489.5">Free &amp; open source</text>
    </g>
  </g>

  <!-- ===== right: monitor -> phone ===== -->
  <!-- PC monitor (hero geometry, scaled) -->
  <g transform="translate(565.5 148.5) scale(0.55)">
    <rect x="70" y="50" width="720" height="408" rx="18" fill="#0b1220" stroke="#334155" stroke-width="3.6"/>
    <g clip-path="url(#screen)">
      <rect x="86" y="66" width="688" height="376" fill="url(#wall)"/>
      <rect x="132" y="104" width="390" height="250" rx="10" fill="#f8fafc"/>
      <rect x="132" y="104" width="390" height="34" rx="10" fill="#e2e8f0"/>
      <rect x="132" y="124" width="390" height="14" fill="#e2e8f0"/>
      <circle cx="152" cy="121" r="6" fill="#f87171"/>
      <circle cx="172" cy="121" r="6" fill="#fbbf24"/>
      <circle cx="192" cy="121" r="6" fill="#34d399"/>
      <rect x="156" y="164" width="230" height="12" rx="6" fill="#cbd5e1"/>
      <rect x="156" y="190" width="320" height="10" rx="5" fill="#e2e8f0"/>
      <rect x="156" y="212" width="290" height="10" rx="5" fill="#e2e8f0"/>
      <rect x="156" y="234" width="305" height="10" rx="5" fill="#e2e8f0"/>
      <rect x="156" y="270" width="140" height="56" rx="8" fill="#dbeafe"/>
      <rect x="312" y="270" width="140" height="56" rx="8" fill="#ede9fe"/>
      <rect x="86" y="408" width="688" height="34" fill="#0f172a" opacity="0.88"/>
      <rect x="374" y="415" width="20" height="20" rx="5" fill="#60a5fa"/>
      <rect x="402" y="415" width="20" height="20" rx="5" fill="#94a3b8"/>
      <rect x="430" y="415" width="20" height="20" rx="5" fill="#94a3b8"/>
      <rect x="458" y="415" width="20" height="20" rx="5" fill="#94a3b8"/>
      <rect x="726" y="417" width="16" height="16" rx="4" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>
      <rect x="728" y="424" width="12" height="7" rx="2" fill="#22c55e"/>
    </g>
    <rect x="405" y="458" width="50" height="34" fill="#334155"/>
    <rect x="330" y="490" width="200" height="12" rx="6" fill="#475569"/>
  </g>
  <!-- the green "you're on the phone" edge -->
  <rect x="988.5" y="187" width="3" height="202" rx="1.5" fill="#22c55e" filter="url(#glow)"/>
  <!-- PC cursor heading for the edge -->
  <use href="#arrow" transform="translate(948 260) scale(0.9)" fill="#ffffff" stroke="#0f172a" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- phone (hero geometry, scaled) -->
  <g transform="translate(342 104.8) scale(0.78)">
    <rect x="900" y="40" width="230" height="470" rx="36" fill="#0b1220" stroke="#475569" stroke-width="2.6"/>
    <g clip-path="url(#phoneScreen)">
      <rect x="910" y="50" width="210" height="450" fill="url(#feed)"/>
      <circle cx="1040" cy="190" r="70" fill="#ffffff" opacity="0.10"/>
      <circle cx="960" cy="330" r="50" fill="#ffffff" opacity="0.08"/>
      <rect x="910" y="50" width="210" height="450" fill="url(#shade)"/>
      <circle cx="1094" cy="320" r="15" fill="#ffffff" opacity="0.92"/>
      <path d="M1094,328 l-7,-7 a4,4 0 0 1 7,-5 a4,4 0 0 1 7,5 z" fill="#f43f5e"/>
      <circle cx="1094" cy="364" r="15" fill="#ffffff" opacity="0.92"/>
      <rect x="1086" y="358" width="16" height="11" rx="3" fill="#64748b"/>
      <circle cx="1094" cy="408" r="15" fill="#ffffff" opacity="0.92"/>
      <path d="M1087,412 l7,-9 l7,9" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="926" y="430" width="96" height="9" rx="4.5" fill="#ffffff" opacity="0.9"/>
      <rect x="926" y="447" width="140" height="8" rx="4" fill="#ffffff" opacity="0.7"/>
      <rect x="926" y="462" width="118" height="8" rx="4" fill="#ffffff" opacity="0.7"/>
      <text x="928" y="74" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#ffffff">9:41</text>
      <rect x="1086" y="65" width="18" height="9" rx="2.5" fill="none" stroke="#ffffff" stroke-width="1.2"/>
      <rect x="1088" y="67" width="11" height="5" rx="1" fill="#ffffff"/>
      <circle cx="1015" cy="66" r="5" fill="#0b1220"/>
      <rect x="985" y="486" width="60" height="4" rx="2" fill="#ffffff" opacity="0.75"/>
    </g>
  </g>

  <!-- crossing -->
  <path d="M974,266 Q1018,214 1062,268" fill="none" stroke="#22c55e" stroke-width="3" stroke-dasharray="7 8" stroke-linecap="round" marker-end="url(#head)"/>

  <!-- the phone's own pointer, pulsing as it arrives -->
  <circle cx="1084" cy="272" r="18" fill="none" stroke="#22c55e" stroke-width="2.5" opacity="0.8"/>
  <circle cx="1084" cy="272" r="27" fill="none" stroke="#22c55e" stroke-width="1.5" opacity="0.35"/>
  <use href="#arrow" transform="translate(1079 267) scale(0.9)" fill="#ffffff" stroke="#0f172a" stroke-width="1.8" stroke-linejoin="round"/>
</svg>
