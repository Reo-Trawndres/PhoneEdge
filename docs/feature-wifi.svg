<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340" role="img" aria-labelledby="t" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">
  <title id="t">Unplug and keep going: pull the USB cable and PhoneEdge carries on over Wi-Fi, with no gap.</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="feed" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#f472b6"/>
      <stop offset="0.5" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowLine" filterUnits="userSpaceOnUse" x="0" y="0" width="600" height="340">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="scr"><rect x="35" y="93" width="276" height="150" rx="4"/></clipPath>
    <clipPath id="ps"><rect x="484" y="76" width="84" height="180" rx="10"/></clipPath>
    <marker id="head" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#22c55e"/>
    </marker>
    <path id="arrow" d="M0,0 V24 L6,18.5 L10.5,28 L14.5,26.2 L10,17 H18 Z"/>
  </defs>

  <rect width="600" height="340" rx="20" fill="url(#bg)"/>
  <text x="28" y="46" font-size="24" font-weight="600" fill="#e2e8f0">Unplug and keep going</text>

  <!-- status pill -->
  <rect x="392" y="24" width="180" height="28" rx="14" fill="#22c55e" filter="url(#glow)"/>
  <text x="482" y="43" font-size="15" font-weight="600" text-anchor="middle" fill="#052e16">USB → Wi-Fi, no gap</text>

  <!-- the USB cable, now pulled out (runs behind the monitor) -->
  <path d="M526,292 C526,310 495,312 455,308 C395,302 345,282 300,238" fill="none" stroke="#475569" stroke-width="5" stroke-linecap="round"/>

  <!-- PC monitor -->
  <rect x="28" y="86" width="290" height="164" rx="10" fill="#0b1220" stroke="#334155" stroke-width="2"/>
  <g clip-path="url(#scr)">
    <rect x="35" y="93" width="276" height="150" fill="url(#wall)"/>
    <rect x="53" y="108" width="156" height="100" rx="4" fill="#f8fafc"/>
    <rect x="53" y="108" width="156" height="14" rx="4" fill="#e2e8f0"/>
    <rect x="53" y="116" width="156" height="6" fill="#e2e8f0"/>
    <circle cx="61" cy="115" r="2.4" fill="#f87171"/>
    <circle cx="69" cy="115" r="2.4" fill="#fbbf24"/>
    <circle cx="77" cy="115" r="2.4" fill="#34d399"/>
    <rect x="63" y="132" width="92" height="5" rx="2.5" fill="#cbd5e1"/>
    <rect x="63" y="143" width="128" height="4" rx="2" fill="#e2e8f0"/>
    <rect x="63" y="152" width="116" height="4" rx="2" fill="#e2e8f0"/>
    <rect x="63" y="161" width="122" height="4" rx="2" fill="#e2e8f0"/>
    <rect x="63" y="176" width="56" height="22" rx="3" fill="#dbeafe"/>
    <rect x="125" y="176" width="56" height="22" rx="3" fill="#ede9fe"/>
    <rect x="35" y="229" width="276" height="14" fill="#0f172a" opacity="0.88"/>
    <rect x="152" y="232" width="8" height="8" rx="2" fill="#60a5fa"/>
    <rect x="164" y="232" width="8" height="8" rx="2" fill="#94a3b8"/>
    <rect x="176" y="232" width="8" height="8" rx="2" fill="#94a3b8"/>
    <rect x="188" y="232" width="8" height="8" rx="2" fill="#94a3b8"/>
    <rect x="296" y="232" width="8" height="8" rx="2" fill="#3a3a3a"/>
    <rect x="296" y="235" width="8" height="5" rx="1.5" fill="#1d8136"/>
  </g>
  <!-- the green "you're on the phone" edge -->
  <rect x="309" y="95" width="2.5" height="146" rx="1.25" fill="#22c55e" filter="url(#glowLine)"/>
  <rect x="160" y="250" width="26" height="14" fill="#334155"/>
  <rect x="123" y="263" width="100" height="6" rx="3" fill="#475569"/>

  <!-- the link continues over Wi-Fi -->
  <path d="M330,124 Q399,66 470,124" fill="none" stroke="#22c55e" stroke-width="3" stroke-dasharray="7 8" stroke-linecap="round" marker-end="url(#head)"/>
  <g fill="none" stroke="#22c55e" stroke-width="6" stroke-linecap="round" filter="url(#glow)">
    <path d="M372.84,149.84 A37,37 0 0 1 425.16,149.84"/>
    <path d="M381.32,158.32 A25,25 0 0 1 416.68,158.32"/>
    <path d="M389.81,166.81 A13,13 0 0 1 408.19,166.81"/>
  </g>
  <circle cx="399" cy="176" r="5" fill="#22c55e" filter="url(#glow)"/>

  <!-- phone -->
  <rect x="480" y="72" width="92" height="188" rx="14" fill="#0b1220" stroke="#475569" stroke-width="2"/>
  <g clip-path="url(#ps)">
    <rect x="484" y="76" width="84" height="180" fill="url(#feed)"/>
    <circle cx="538" cy="132" r="28" fill="#ffffff" opacity="0.10"/>
    <circle cx="502" cy="188" r="20" fill="#ffffff" opacity="0.08"/>
    <rect x="484" y="76" width="84" height="180" fill="url(#shade)"/>
    <g fill="#ffffff" opacity="0.92">
      <circle cx="555" cy="194" r="6"/>
      <circle cx="555" cy="212" r="6"/>
      <circle cx="555" cy="230" r="6"/>
    </g>
    <rect x="490" y="227" width="38" height="4" rx="2" fill="#ffffff" opacity="0.9"/>
    <rect x="490" y="235" width="52" height="3.5" rx="1.75" fill="#ffffff" opacity="0.7"/>
    <rect x="491" y="82" width="13" height="4" rx="2" fill="#ffffff"/>
    <rect x="553" y="82" width="9" height="4.5" rx="1.2" fill="none" stroke="#ffffff" stroke-width="0.9"/>
    <circle cx="526" cy="84" r="2.6" fill="#0b1220"/>
    <rect x="514" y="249" width="24" height="2" rx="1" fill="#ffffff" opacity="0.75"/>
  </g>
  <!-- the phone's pointer, still going -->
  <circle cx="512" cy="152" r="8" fill="none" stroke="#22c55e" stroke-width="2" opacity="0.85"/>
  <circle cx="512" cy="152" r="12.5" fill="none" stroke="#22c55e" stroke-width="1.3" opacity="0.4"/>
  <use href="#arrow" transform="translate(510 150) scale(0.7)" fill="#ffffff" stroke="#0f172a" stroke-width="2" stroke-linejoin="round"/>

  <!-- plug, just out, with a small spark -->
  <rect x="520" y="257.5" width="12" height="2" rx="1" fill="#1e293b"/>
  <rect x="521" y="272" width="10" height="6" rx="1.5" fill="#94a3b8"/>
  <rect x="517.5" y="277" width="17" height="16" rx="4" fill="#334155" stroke="#64748b" stroke-width="1.5"/>
  <g stroke="#fbbf24" stroke-width="2" stroke-linecap="round">
    <path d="M513,266 h-8"/>
    <path d="M514,270 l-7,4"/>
    <path d="M539,266 h8"/>
    <path d="M538,270 l7,4"/>
  </g>
  <path d="M526,259.5 l1.9,4.6 4.6,1.9 -4.6,1.9 -1.9,4.6 -1.9,-4.6 -4.6,-1.9 4.6,-1.9 z" fill="#fde68a"/>
</svg>
