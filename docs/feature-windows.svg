<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340" role="img" aria-labelledby="t" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">
  <title id="t">Extra phone screens on your PC: open more phone apps side by side in their own windows. Ctrl+Alt+N opens one.</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="feed" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#f472b6"/>
      <stop offset="0.5" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="pick" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1c21"/>
      <stop offset="1" stop-color="#101114"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="scr"><rect x="116" y="80" width="368" height="200" rx="5"/></clipPath>
    <clipPath id="w1"><rect x="164" y="90" width="76" height="164" rx="7"/></clipPath>
    <clipPath id="w2"><rect x="262" y="90" width="76" height="164" rx="7"/></clipPath>
    <clipPath id="w3"><rect x="360" y="90" width="76" height="164" rx="7"/></clipPath>
    <path id="arrow" d="M0,0 V24 L6,18.5 L10.5,28 L14.5,26.2 L10,17 H18 Z"/>
    <g id="bar">
      <rect width="76" height="16" fill="#1e293b"/>
      <circle cx="8" cy="8" r="2.5" fill="#22c55e"/>
      <path d="M65,5 l6,6 m0,-6 l-6,6" stroke="#94a3b8" stroke-width="1.3" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="600" height="340" rx="20" fill="url(#bg)"/>
  <text x="28" y="46" font-size="24" font-weight="600" fill="#e2e8f0">Extra phone screens on your PC</text>

  <!-- key hint -->
  <g font-size="14" font-weight="600" text-anchor="middle" fill="#e2e8f0">
    <g fill="#1e293b" stroke="#475569" stroke-width="1.5">
      <rect x="432" y="24" width="44" height="28" rx="7"/>
      <rect x="490" y="24" width="38" height="28" rx="7"/>
      <rect x="542" y="24" width="30" height="28" rx="7"/>
    </g>
    <text x="454" y="43">Ctrl</text>
    <text x="509" y="43">Alt</text>
    <text x="557" y="43">N</text>
    <g font-size="16" font-weight="400" fill="#94a3b8"><text x="483" y="44">+</text><text x="535" y="44">+</text></g>
  </g>

  <!-- PC monitor -->
  <rect x="108" y="72" width="384" height="216" rx="12" fill="#0b1220" stroke="#334155" stroke-width="2"/>
  <g clip-path="url(#scr)">
    <rect x="116" y="80" width="368" height="200" fill="url(#wall)"/>
    <g fill="#000000" opacity="0.3">
      <rect x="167" y="95" width="76" height="164" rx="7"/>
      <rect x="265" y="95" width="76" height="164" rx="7"/>
      <rect x="363" y="95" width="76" height="164" rx="7"/>
    </g>

    <!-- window 1: a chat-like list -->
    <g clip-path="url(#w1)">
      <rect x="164" y="90" width="76" height="164" fill="#f8fafc"/>
      <rect x="164" y="106" width="76" height="18" fill="#e2e8f0"/>
      <rect x="171" y="113" width="30" height="4" rx="2" fill="#94a3b8"/>
      <circle cx="176" cy="138" r="7" fill="#60a5fa"/>
      <circle cx="176" cy="162" r="7" fill="#f472b6"/>
      <circle cx="176" cy="186" r="7" fill="#34d399"/>
      <circle cx="176" cy="210" r="7" fill="#fbbf24"/>
      <circle cx="176" cy="234" r="7" fill="#a78bfa"/>
      <g fill="#64748b">
        <rect x="188" y="132" width="34" height="4" rx="2"/>
        <rect x="188" y="156" width="28" height="4" rx="2"/>
        <rect x="188" y="180" width="36" height="4" rx="2"/>
        <rect x="188" y="204" width="30" height="4" rx="2"/>
        <rect x="188" y="228" width="33" height="4" rx="2"/>
      </g>
      <g fill="#cbd5e1">
        <rect x="188" y="140" width="26" height="3" rx="1.5"/>
        <rect x="188" y="164" width="32" height="3" rx="1.5"/>
        <rect x="188" y="188" width="22" height="3" rx="1.5"/>
        <rect x="188" y="212" width="28" height="3" rx="1.5"/>
        <rect x="188" y="236" width="24" height="3" rx="1.5"/>
      </g>
      <circle cx="233" cy="138" r="2.5" fill="#22c55e"/>
      <circle cx="233" cy="186" r="2.5" fill="#22c55e"/>
      <use href="#bar" x="164" y="90"/>
    </g>

    <!-- window 2: a video -->
    <g clip-path="url(#w2)">
      <rect x="262" y="90" width="76" height="164" fill="url(#feed)"/>
      <circle cx="312" cy="140" r="26" fill="#ffffff" opacity="0.10"/>
      <circle cx="278" cy="212" r="18" fill="#ffffff" opacity="0.08"/>
      <rect x="262" y="90" width="76" height="164" fill="url(#shade)"/>
      <circle cx="300" cy="172" r="14" fill="#ffffff" opacity="0.92"/>
      <path d="M296,164.5 L307,172 L296,179.5 Z" fill="#7c3aed"/>
      <rect x="270" y="240" width="60" height="3" rx="1.5" fill="#ffffff" opacity="0.4"/>
      <rect x="270" y="240" width="24" height="3" rx="1.5" fill="#ffffff"/>
      <circle cx="294" cy="241.5" r="3.5" fill="#ffffff"/>
      <use href="#bar" x="262" y="90"/>
    </g>

    <!-- window 3: PhoneEdge's own app picker -->
    <g clip-path="url(#w3)">
      <rect x="360" y="90" width="76" height="164" fill="url(#pick)"/>
      <rect x="367" y="114" width="62" height="12" rx="6" fill="#292b31"/>
      <circle cx="375" cy="119.5" r="2.6" fill="none" stroke="#848993" stroke-width="1.2"/>
      <path d="M377,121.5 l2,2" stroke="#848993" stroke-width="1.2" stroke-linecap="round"/>
      <rect x="383" y="118.5" width="24" height="3" rx="1.5" fill="#3f4249"/>
      <rect x="368" y="136" width="16" height="16" rx="5" fill="#4a7bec"/>
      <rect x="390" y="136" width="16" height="16" rx="5" fill="#2aa168"/>
      <rect x="412" y="136" width="16" height="16" rx="5" fill="#e0782c"/>
      <rect x="368" y="162" width="16" height="16" rx="5" fill="#d5485a"/>
      <rect x="390" y="162" width="16" height="16" rx="5" fill="#865ae0"/>
      <rect x="412" y="162" width="16" height="16" rx="5" fill="#1f98b8"/>
      <rect x="368" y="188" width="16" height="16" rx="5" fill="#be8614"/>
      <rect x="390" y="188" width="16" height="16" rx="5" fill="#cc4c9a"/>
      <rect x="412" y="188" width="16" height="16" rx="5" fill="#2aa168"/>
      <rect x="368" y="214" width="16" height="16" rx="5" fill="#1f98b8"/>
      <rect x="390" y="214" width="16" height="16" rx="5" fill="#e0782c"/>
      <rect x="412" y="214" width="16" height="16" rx="5" fill="#865ae0"/>
      <g fill="#3f4249">
        <rect x="370" y="155" width="12" height="2" rx="1"/><rect x="392" y="155" width="12" height="2" rx="1"/><rect x="414" y="155" width="12" height="2" rx="1"/>
        <rect x="370" y="181" width="12" height="2" rx="1"/><rect x="392" y="181" width="12" height="2" rx="1"/><rect x="414" y="181" width="12" height="2" rx="1"/>
        <rect x="370" y="207" width="12" height="2" rx="1"/><rect x="392" y="207" width="12" height="2" rx="1"/><rect x="414" y="207" width="12" height="2" rx="1"/>
        <rect x="370" y="233" width="12" height="2" rx="1"/><rect x="392" y="233" width="12" height="2" rx="1"/><rect x="414" y="233" width="12" height="2" rx="1"/>
      </g>
      <rect x="387.5" y="185.5" width="21" height="21" rx="7" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.2"/>
      <use href="#bar" x="360" y="90"/>
    </g>

    <!-- taskbar -->
    <rect x="116" y="264" width="368" height="16" fill="#0f172a" opacity="0.88"/>
    <rect x="268" y="267" width="10" height="10" rx="2.5" fill="#60a5fa"/>
    <rect x="284" y="267" width="10" height="10" rx="2.5" fill="#94a3b8"/>
    <g fill="none" stroke="#e2e8f0" stroke-width="1.2">
      <rect x="300.5" y="266.5" width="7" height="11" rx="1.8"/>
      <rect x="313.5" y="266.5" width="7" height="11" rx="1.8"/>
      <rect x="326.5" y="266.5" width="7" height="11" rx="1.8"/>
    </g>
    <rect x="466" y="267" width="10" height="10" rx="2.5" fill="#3a3a3a"/>
    <rect x="466" y="271" width="10" height="6" rx="2" fill="#1d8136"/>
  </g>
  <!-- the window you're in -->
  <rect x="360" y="90" width="76" height="164" rx="7" fill="none" stroke="#22c55e" stroke-width="2" filter="url(#glow)"/>
  <use href="#arrow" transform="translate(399 196) scale(0.75)" fill="#ffffff" stroke="#0f172a" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- stand -->
  <rect x="283" y="288" width="34" height="16" fill="#334155"/>
  <rect x="235" y="303" width="130" height="7" rx="3.5" fill="#475569"/>
</svg>
